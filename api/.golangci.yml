# Mirrors the lint setup used in our other Go services so the rules feel the same everywhere.
version: "2"
linters:
  # see also https://golangci-lint.run/usage/linters/#enabled-by-default
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - goconst
    - goprintffuncname
    - iface
    - intrange
    - mirror
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  exclusions:
    rules:
      # Test helpers (decodeJSON, postJSON, mustGet) own and close response bodies, but
      # bodyclose cannot see through them and reports every call. It stays on for real code.
      - path: _test\.go
        linters:
          - bodyclose
  settings:
    errcheck:
      exclude-functions:
        - "(io.Closer).Close"
      verbose: true
    exhaustive:
      check:
        - switch
        - map
    goconst:
      min-occurrences: 100
formatters:
  enable:
    - gofmt
    - goimports
