name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the checks (and, on main, the publish) by hand. Publishing is
  # restricted to main below: a dispatch on any other branch only runs the checks.
  workflow_dispatch:

# Least privilege by default; only the publish job below is granted anything more.
permissions:
  contents: read

concurrency:
  # A run on main publishes an image, and cancelling one partway could leave a half-pushed tag,
  # so main runs are never cancelled. GitHub keeps only ONE pending run per group, though: in a
  # burst of pushes an intermediate commit's run is dropped (its sha tag is never published) and
  # the newest commit always runs last, so it wins the moving tags. Superseded pull request runs
  # are cancelled, since only the latest push matters there.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a new release cannot break CI; bump it in its own PR.
          version: v2.14.0
          working-directory: api
          args: --timeout=5m
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - uses: docker/setup-buildx-action@v3

      # The image is built for the host architecture, loaded, and smoke-tested for real:
      # it must refuse to boot without a secret, report the stamped version, serve the SPA
      # and the API, turn healthy and run as non-root.
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: shadowcommit:ci
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Smoke test the image
        run: scripts/smoke-container.sh shadowcommit:ci 18080 "$VERSION"

      # The production host is arm64. The Go binary is cross-compiled (no emulation), so this
      # proves the arm64 image builds; it cannot be executed on the amd64 runner.
      - name: Build image (linux/arm64, cross-compiled)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  # The deployment files are code too: lint the scripts, run the updater's scenario tests with a
  # fake docker, and validate the compose file and the Caddyfile.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck deploy/update.sh deploy/notify-chat.sh deploy/backup.sh deploy/test/test-update.sh deploy/test/test-notify-chat.sh deploy/test/test-backup.sh deploy/test/fake-docker deploy/test/fake-curl

      - name: Updater scenario tests
        run: deploy/test/test-update.sh

      - name: Chat notification tests
        run: deploy/test/test-notify-chat.sh

      - name: Backup scenario tests
        run: deploy/test/test-backup.sh

      - name: Validate the compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          echo "SHADOWCOMMIT_DOMAIN=ci.example.org" >> .env
          # Capture the output first: "grep -q" closes the pipe on its first match, and under
          # pipefail the resulting SIGPIPE in docker compose would fail the step at random.
          rendered=$(docker compose config)
          # A single host name must drive all three public URLs.
          grep -q 'APP_BASE_URL: https://ci.example.org' <<<"$rendered"
          grep -q 'WEB_BASE_URL: https://ci.example.org' <<<"$rendered"
          grep -q 'CORS_ORIGINS: https://ci.example.org' <<<"$rendered"

      - name: Validate the Caddyfile
        run: >
          docker run --rm -e SHADOWCOMMIT_DOMAIN=ci.example.org
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile

  # Publishes the image only after every other job has passed, and only from main: this job can
  # write to the container registry that the host pulls from, so unreviewed branches and pull
  # requests never reach it. A manual dispatch on main publishes the sha tag only.
  publish:
    needs: [api, web, docker, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry with the workflow's own token
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            io.shadowcommit.github.actions.run-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # sha-<short> is immutable and always published. The moving tags are published only for
          # a real push to main: a manual dispatch (even on main) must never move them.
          tags: |
            type=raw,value=sha-${{ steps.version.outputs.short }}
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      # One multi-platform build: the arm64 binary is cross-compiled, so no emulation is needed.
      # The layer cache was already warmed by the docker job above.
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A plain image index: provenance attestations add unknown/unknown entries to it, which
          # confuse tools that compare digests, such as the host's pull-based deploy script.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.short }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      - name: Verify both architectures were published
        run: |
          # Use the exact reference that was pushed: metadata-action lowercases the image name,
          # which a hand-built ghcr.io/${{ github.repository }} would not.
          manifest=$(docker buildx imagetools inspect "${{ fromJSON(steps.meta.outputs.json).tags[0] }}")
          echo "$manifest"
          grep -q 'linux/amd64' <<<"$manifest"
          grep -q 'linux/arm64' <<<"$manifest"
